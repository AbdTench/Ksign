workflows:
  ios-workflow:
    name: Ksign Beta Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build unsigned IPA
        script: |
          xcodebuild -project Ksign.xcodeproj -scheme Ksign -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
